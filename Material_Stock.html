const IDB_NAME='stock_material_v1';
const IDB_STORE='app';
const IDB_KEY='state';
const seed={materials:[],suppliers:[],quarries:['SELING','LIMBUR','SAROLANGUN','BUNGO'],stockpiles:['OD005','OF012','OG006','PABRIK'],units:[{code:'DT52',driver:'JULIAN'},{code:'DT53',driver:'MISTONO'},{code:'DT54',driver:'TRI WAHYUDI'},{code:'DT56',driver:'IMAM ZAINURI'},{code:'DT57',driver:'RATNA AGIL'},{code:'DT58',driver:'RUDI SUPRIONO'}],drivers:['JULIAN','MISTONO','TRI WAHYUDI','IMAM ZAINURI','RATNA AGIL','RUDI SUPRIONO'],pics:['ULUN PRIYATNA ESA','SABIHURI','SUGIANTO','JOKO PRIYANTO'],locations:LOCATIONS,po:[],ins:[],outs:[],stockOpening:[]};
function makeId(prefix='ID'){
  try{ if(window.crypto && typeof window.crypto.randomUUID==='function') return window.crypto.randomUUID(); }catch(_){}
  return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
}
let db=structuredClone(seed), page='dashboard', storageReady=false, lastFactorValue=1.76, storageDb=null;
function openStorage(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)) return reject(new Error('IndexedDB tidak didukung perangkat ini.'));
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(IDB_STORE))req.result.createObjectStore(IDB_STORE)};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('Database lokal gagal dibuka.'));
  });
}
function idbRead(store,key){
  return new Promise((resolve,reject)=>{
    const req=store.get(key);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
function idbWrite(store,key,value){
  return new Promise((resolve,reject)=>{
    const req=store.put(value,key);
    req.onsuccess=()=>resolve();
    req.onerror=()=>reject(req.error);
  });
}
async function initAppStorage(){
  try{
    storageDb=await openStorage();
    const tx=storageDb.transaction(IDB_STORE,'readonly');
    const state=await idbRead(tx.objectStore(IDB_STORE),IDB_KEY);
    const data=state?.data?mergeSeed(state.data):structuredClone(seed);
    // Repair old Material Masuk factor values when the saved Volume is reliable.
    if(Array.isArray(data.ins)){
      data.ins.forEach(tx=>{
        const net=Number(tx.netto),vol=Number(tx.volume);
        const stored=Number(String(tx.factor??'').replace(',','.'));
        if(net>0&&vol>0&&(!Number.isFinite(stored)||stored<=0.5)){
          const derived=vol/(net/1000);
          if(Number.isFinite(derived)&&derived>0)tx.factor=Math.round(derived*100)/100;
        }
      });
    }
    db=data;
    lastFactorValue=decNum(state?.lastFactor)||1.76;
    storageReady=true;
    await save();
    nav();render();
  }catch(e){
    storageReady=false;
    nav();render();
    setTimeout(()=>toast('Database lokal tidak dapat dibuka. Data belum disimpan.'),300);
  }
}
function mergeSeed(x){
  const d=structuredClone(seed);
  return Object.assign(d,x,{locations:Array.from(new Set([...(x.locations||[]),...LOCATIONS]))});
}
function save(){
  if(!storageReady||!storageDb)return Promise.resolve();
  const snapshot=structuredClone(db),factor=lastFactorValue;
  try{
    const tx=storageDb.transaction(IDB_STORE,'readwrite');
    return idbWrite(tx.objectStore(IDB_STORE),IDB_KEY,{
      data:snapshot,lastFactor:factor,updatedAt:new Date().toISOString()
    }).catch(()=>{});
  }catch(_){return Promise.resolve()}
}
function exportFactor(tx){
  const stored=decNum(tx?.factor ?? tx?.factorValue ?? tx?.FACTOR);
  const net=Number(tx?.netto)||0;
  const vol=Number(tx?.volume)||0;
  // Legacy revisions could store a broken derived value such as 0.094444444.
  // For export only, recover the intended transaction factor from its saved Netto/Volume.
  if(net>0 && vol>0 && (!Number.isFinite(stored) || stored<=0.5)){
    const recovered=vol/(net/1000);
    if(Number.isFinite(recovered) && recovered>0) return Math.round(recovered*100)/100;
  }
  return Number.isFinite(stored) && stored>0 ? stored : '';
}
function esc(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}

function num(v){const s=String(v??'').trim();if(!s)return 0;if(s.includes(','))return Number(s.replace(/\./g,'').replace(',','.'))||0;if(/^[-+]?\d+\.\d{1,2}$/.test(s))return Number(s)||0;return Number(s.replace(/\./g,''))||0}
function decNum(v){const s=String(v??'').trim();if(!s)return 0;if(s.includes(','))return Number(s.replace(/\./g,'').replace(',','.'))||0;return Number(s)||0}
function fmtInput(n){return n===null||n===undefined||n===''?'':Number(n).toLocaleString('id-ID',{minimumFractionDigits:0,maximumFractionDigits:2})}

async function saveBlobToAndroid(blob, filename){
  if(window.AndroidFileBridge && AndroidFileBridge.saveFile){
    const dataUrl=await new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(reader.result);
      reader.onerror=reject;
      reader.readAsDataURL(blob);
    });
    const comma=dataUrl.indexOf(',');
    if(comma<0)throw new Error('file');
    const ok=AndroidFileBridge.saveFile(filename,dataUrl.slice(comma+1),blob.type||'application/octet-stream');
    if(!ok)throw new Error('save');
    return true;
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
  return true;
}

async function restoreFrom(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const raw=JSON.parse(r.result),x=raw.data||raw;
      if(!x||!Array.isArray(x.ins)||!Array.isArray(x.outs)||!Array.isArray(x.po))throw new Error('invalid');
      if(!confirm('Restore akan menggantikan data aplikasi saat ini dengan isi backup. Lanjutkan?'))return;
      db=mergeSeed(x);
      lastFactorValue=decNum(raw.lastFactor)||1.76;
      await save();
      render();
      toast('Restore berhasil.');
    }catch(e){toast('FILE BACKUP TIDAK VALID.')}
  };
  r.readAsText(file);
}

   EXPORT XLSX + GOOGLE SHEET

const GOOGLE_SHEET_WEB_APP_URL='https://script.google.com/macros/s/AKfycbxIKYbjo3ac7Mdel66_vOoTfD77Obpv7d5WY8sXZq_gdu83G9OQT3CE00X3oEfsl4Y7/exec';

function xlsxXmlEsc(v){
  return String(v??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&apos;');
}

function xlsxColName(n){
  let s='';
  while(n>0){
    const r=(n-1)%26;
    s=String.fromCharCode(65+r)+s;
    n=Math.floor((n-1)/26);
  }
  return s;
}

function xlsxCell(ref,value,numeric){
  if(value===null||value===undefined||value==='')return `<c r="${ref}" t="inlineStr"><is><t></t></is></c>`;
  if(numeric){
    const n=Number(value);
    if(Number.isFinite(n))return `<c r="${ref}"><v>${n}</v></c>`;
  }
  return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xlsxXmlEsc(value)}</t></is></c>`;
}

function xlsxSheetXml(rows,numericCols){
  let maxCols=0;
  rows.forEach(r=>{if(r.length>maxCols)maxCols=r.length});
  const rowXml=rows.map((row,ri)=>{
    const cells=[];
    for(let ci=0;ci<maxCols;ci++){
      const value=row[ci]??'';
      cells.push(xlsxCell(xlsxColName(ci+1)+(ri+1),value,numericCols.includes(ci)));
    }
    return `<row r="${ri+1}">${cells.join('')}</row>`;
  }).join('');
  const ref=`A1:${xlsxColName(maxCols)}${Math.max(rows.length,1)}`;
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="${ref}"/><sheetViews><sheetView workbookViewId="0"/></sheetViews><sheetFormatPr defaultRowHeight="15"/><sheetData>${rowXml}</sheetData><autoFilter ref="A1:${xlsxColName(maxCols)}${Math.max(rows.length,1)}"/><sheetProtection sheet="0"/></worksheet>`;
}

function crc32(bytes){
  let crc=0xffffffff;
  for(let i=0;i<bytes.length;i++){
    crc^=bytes[i];
    for(let j=0;j<8;j++)crc=(crc>>>1)^((crc&1)?0xedb88320:0);
  }
  return (crc^0xffffffff)>>>0;
}

function u16(n){return new Uint8Array([n&255,(n>>>8)&255]);}
function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]);}
function concatBytes(parts){
  let total=0;parts.forEach(p=>total+=p.length);
  const out=new Uint8Array(total);let off=0;
  parts.forEach(p=>{out.set(p,off);off+=p.length});
  return out;
}

function zipStore(files){
  const enc=new TextEncoder(),locals=[],centrals=[];let offset=0;
  files.forEach(file=>{
    const name=enc.encode(file.name),data=enc.encode(file.data),crc=crc32(data);
    const local=concatBytes([
      new Uint8Array([0x50,0x4b,0x03,0x04]),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data
    ]);
    locals.push(local);
    const central=concatBytes([
      new Uint8Array([0x50,0x4b,0x01,0x02]),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name
    ]);
    centrals.push(central);offset+=local.length;
  });
  const centralData=concatBytes(centrals);
  const localData=concatBytes(locals);
  const end=concatBytes([
    new Uint8Array([0x50,0x4b,0x05,0x06]),u16(0),u16(0),u16(files.length),u16(files.length),u32(centralData.length),u32(localData.length),u16(0)
  ]);
  return concatBytes([localData,centralData,end]);
}

async function sendToGoogleSheet(){
  if(!navigator.onLine)return toast('Internet tidak tersedia. Data lokal tetap aman.');
  if(!GOOGLE_SHEET_WEB_APP_URL)return toast('Alamat Google Sheet belum diatur.');
  if(!storageReady)return toast('Database lokal belum siap.');
  if(!confirm(`Kirim semua transaksi ke Google Sheet?\\n\\nMaterial Masuk: ${db.ins.length}\\nMaterial Keluar: ${db.outs.length}\\n\\nGoogle Sheet akan diperbarui penuh.`))return;

  try{
    toast('Mengirim data ke Google Sheet...');
    const payload=googleSheetPayload();
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),60000);
    const response=await fetch(GOOGLE_SHEET_WEB_APP_URL,{
      method:'POST',
      mode:'cors',
      cache:'no-store',
      credentials:'omit',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload),
      signal:controller.signal
    });
    clearTimeout(timer);
    const text=await response.text();
    let result;
    try{result=JSON.parse(text)}catch(_){throw new Error('Respons Google Sheet tidak valid.')} 
    if(!result.ok)throw new Error(result.message||'Google Sheet menolak data.');
    const a=result.result||{};
    toast(`Berhasil dikirim. Masuk ${a.materialMasuk||0}, Keluar ${a.materialKeluar||0}.`);
  }catch(e){
    console.error('Google Sheet:',e);
    const msg=e?.name==='AbortError'?'Waktu pengiriman habis.':(e?.message||'Pengiriman gagal.');
    toast('Kirim gagal: '+msg);
  }
}

 }

<script id="final1-revisi4-hard-input-limits">
(function(){
  function enforce(el, max){
    if (!el || el.dataset.limitBound === "1") return;
    el.dataset.limitBound = "1";
    el.maxLength = max;
    el.addEventListener("input", function(){
      if (this.value.length > max) {
        const pos = this.selectionStart;
        this.value = this.value.slice(0, max);
        try { this.setSelectionRange(Math.min(pos, max), Math.min(pos, max)); } catch(e){}
      }
    }, true);
  }
  function scan(){
    document.querySelectorAll('input,textarea').forEach(function(el){
      const t = ((el.name||"")+" "+(el.id||"")+" "+(el.placeholder||"")).toLowerCase();
      if (/plate|plat|no.?polisi|nopol|nomor.?polisi/.test(t)) enforce(el, 9);
      if (/^wo$|work.?order|no.?wo|nomor.?wo/.test(t)) enforce(el, 23);
    });
  }
  scan();
  new MutationObserver(scan).observe(document.documentElement,{subtree:true,childList:true});
})();
</script>


<script id="final1-revisi4-search-fix">
(function(){
  const isSearch = el => el && el.tagName==="INPUT" &&
    (el.type==="search" || /search|cari|filter/i.test((el.name||"")+" "+(el.id||"")+" "+(el.placeholder||"")));
  document.addEventListener("input", function(e){
    if (!isSearch(e.target)) return;
    const el=e.target, val=el.value, start=el.selectionStart, end=el.selectionEnd;
    requestAnimationFrame(function(){
      const active = document.activeElement;
      if (active !== el && document.body.contains(el)) {
        el.focus({preventScroll:true});
        try{el.setSelectionRange(Math.min(start,val.length),Math.min(end,val.length));}catch(_){}
      }
    });
  }, true);
})();
</script>


<script id="final1-revisi4-factor-guard">
(function(){
  // Guard: if a transaction exposes factor/factorValue, never derive FACTOR from volume.
  // The export layer should use the stored transaction factor.
  window.__stockMaterialFactorForExport = function(tx){
    if (!tx) return "";
    const f = tx.factor ?? tx.factorValue ?? tx.FACTOR;
    if (f === "" || f == null) return "";
    const n = Number(String(f).replace(",", "."));
    return Number.isFinite(n) ? n : f;
  };
})();
</script>

  window.openOutForm=function(id=''){
    pushEditModalHistory();
    const x=db.outs.find(z=>z.id===id),last=db.outs.length?db.outs[db.outs.length-1]:null,date=x?.date||last?.date||today(),formId=id||nextOutId();
    modal(id?'Edit Material Keluar':'Material Keluar',`<div class="notice">1 ticket = 1 Material + 1 Kode Lokasi Jalan. WO boleh dipakai pada beberapa ticket.</div><div class="formgrid">
      <div class="field"><label class="req">Tanggal</label><input id="outDate" type="date" value="${date}" onchange="refreshWO()"></div><div class="field"><label class="req">Jam Keluar</label><input id="outTime" type="time" value="${x?.time||timeNow()}"></div>
      <div class="field full"><label class="req">WO</label><input id="outWO" maxlength="23" value="${esc(x?.wo||('WOGIF/SA1/'+date.slice(0,7).replace('-','')+'/'))}" oninput="upperify(this);this.value=this.value.slice(0,23)"><div class="help">Awal otomatis WOGIF/SA1/YYYYMM/. Ketik 6 digit terakhir.</div></div>
      <div class="field"><label class="req">Ticket ID</label><input class="readonly" readonly value="${esc(x?.id||formId)}"></div><div class="field"><label class="req">Material</label><select id="outMat"><option value="">Pilih Material</option>${materialOptions(x?.material)}</select></div>
      <div class="field"><label class="req">Stockpile Asal</label><select id="outStock"><option value="">Pilih Stockpile</option>${db.stockpiles.map(z=>`<option ${z===(x?.stockpile||'')?'selected':''}>${esc(z)}</option>`).join('')}</select></div>
      <div class="field"><label class="req">Unit</label><select id="outUnit"><option value="">Pilih Unit</option>${db.units.map(z=>`<option ${z.code===(x?.unit||'')?'selected':''}>${esc(z.code)}</option>`).join('')}</select></div>
      <div class="field"><label class="req">Driver</label><select id="outDriver"><option value="">Pilih Driver</option>${db.drivers.map(z=>`<option ${z===(x?.driver||'')?'selected':''}>${esc(z)}</option>`).join('')}</select></div>
      <div class="field"><label class="req">PIC / Mandor Pengeluaran</label><select id="outPIC"><option value="">Pilih PIC / Mandor</option>${db.pics.map(z=>`<option ${z===(x?.pic||'')?'selected':''}>${esc(z)}</option>`).join('')}</select></div>
      <div class="field full"><label class="req">Kode Lokasi Jalan</label><select id="outLoc"><option value="">Pilih Kode Lokasi</option>${db.locations.map(z=>`<option ${z===(x?.location||'')?'selected':''}>${esc(z)}</option>`).join('')}</select></div>
      <div class="field"><label class="req">RIT</label><input id="outRit" inputmode="numeric" value="${x?.rit||''}" oninput="calcOutVol()"></div><div class="field"><label class="req">Volume (M³)</label><input id="outVol" inputmode="decimal" value="${x?fmtInput(x.volume):''}" data-edited="${x?'1':''}" oninput="this.dataset.edited='1'"></div>
      <div class="field full"><label>Catatan</label><textarea id="outNote" rows="2">${esc(x?.note||'')}</textarea></div>
      </div><div class="form-actions"><button type="button" class="btn" onclick="closeEditModal()">Batal</button><button type="button" class="btn primary" onclick="saveOut('${id}','${formId}')">Simpan</button></div>`);calcOutVol();
  };

  window.saveOut=async function(id,formId){
    try{
      const el=id0=>document.getElementById(id0);
      const date=el('outDate')?.value||'';
      const time=el('outTime')?.value||'';
      const wo=(el('outWO')?.value||'').trim().toUpperCase().slice(0,23);
      const tid=id||formId;
      const mat=el('outMat')?.value||'';
      const sp=el('outStock')?.value||'';
      const unit=el('outUnit')?.value||'';
      const driver=el('outDriver')?.value||'';
      const pic=el('outPIC')?.value||'';
      const loc=el('outLoc')?.value||'';
      const ritRaw=(el('outRit')?.value||'').trim();
      const rit=Number(ritRaw);
      const vol=num(el('outVol')?.value||'');
      const note=(el('outNote')?.value||'').trim();
      const old=db.outs.find(x=>x.id===id);

      if(!date||!time||!validWO(wo)||!mat||!sp||!unit||!driver||!pic||!loc||!ritRaw||!Number.isInteger(rit)||rit<=0||vol<=0||Math.round(vol*100)/100!==vol){
        return toast(validWO(wo)?'Lengkapi semua field wajib.':'WO TIDAK VALID.');
      }

      // Saat edit, stok transaksi lama dikembalikan dulu melalui excludeOutId.
      // Dengan begitu volume baru boleh sama dengan stok tersedia setelah transaksi lama dilepas.
      const available=currentStock(sp,mat,id||'','');
      if(vol>available+0.000001) return toast('STOK TIDAK MENCUKUPI');

      const rec={
        id:tid,date,time,wo,material:mat,stockpile:sp,unit,driver,pic,
        location:loc,rit,volume:Math.round(vol*100)/100,note,
        createdAt:old?.createdAt||new Date().toISOString(),docPhotoName:old?.docPhotoName||''
      };
      if(id){
        const target=db.outs.find(x=>x.id===id);
        if(!target) return toast('TRANSAKSI TIDAK DITEMUKAN.');
        Object.assign(target,rec);
      }else{
        db.outs.push(rec);
      }
      save();
      closeEditModal();
      render();
      toast('Material Keluar tersimpan.');
    }catch(err){
      console.error(err);
      toast('GAGAL MENYIMPAN MATERIAL KELUAR.');
    }
  };
  window.deleteOut=function(id){const x=db.outs.find(z=>z.id===id);if(!x)return;if(!confirm('Hapus transaksi Material Keluar? Efek stok akan dibatalkan/dihapus.'))return;db.outs=db.outs.filter(z=>z.id!==id);save();render();toast('Material Keluar dihapus.')};
})();
</script>

<script id="document-photo-final">
(function(){
  function getTx(type,id){return type==='MASUK'?db.ins.find(x=>x.id===id):db.outs.find(x=>x.id===id)}
  window.captureDocumentPhoto=function(type,id){
    const x=getTx(type,id); if(!x)return toast('TRANSAKSI TIDAK DITEMUKAN.');
    const name=(type==='MASUK'?x.chit:x.id);
    if(!name)return toast('NOMOR TIKET/CHIT TIDAK TERSEDIA.');
    window.__pendingPhoto={type,id,name:String(name)+'.jpg'};
    if(window.AndroidDocumentBridge&&AndroidDocumentBridge.capture){
      AndroidDocumentBridge.capture(type,String(name));
    }else{
      window.__pendingPhoto=null;
      toast('Fitur kamera Android belum tersedia.');
    }
  };
  window.onAndroidPhotoCaptured=function(type,name){
    const p=window.__pendingPhoto;
    if(!p||p.type!==type){window.__pendingPhoto=null;return toast('Transaksi foto tidak ditemukan.');}
    const x=getTx(type,p.id);
    if(!x){window.__pendingPhoto=null;return toast('TRANSAKSI SUDAH TIDAK ADA.');}
    x.docPhotoName=name;
    window.__pendingPhoto=null;
    save().then(()=>{render();toast('Foto dokumen tersimpan: '+name);if(type==='MASUK')viewIn(x.id);else viewOut(x.id);});
  };
  window.onAndroidPhotoError=function(message){window.__pendingPhoto=null;toast(message||'Foto gagal disimpan.');};
  window.viewDocumentPhoto=function(type,name){
    if(!name)return toast('Belum ada foto dokumen.');
    if(!window.AndroidDocumentBridge||!AndroidDocumentBridge.photoExists)return toast('Fitur foto belum tersedia.');
    if(!AndroidDocumentBridge.photoExists(type,name))return toast('Foto tidak ditemukan di Galeri HP.');
    const b64=AndroidDocumentBridge.getPhotoBase64(type,name);
    if(!b64)return toast('Foto tidak dapat dibuka.');
    modal('Foto Dokumen',`<div style="text-align:center"><img src="data:image/jpeg;base64,${b64}" style="max-width:100%;max-height:70vh;border-radius:12px;object-fit:contain"><div class="mini" style="margin-top:8px">${esc(name)}</div></div>`);
  };
})();
</script>
<script id="master-crud-final-fix">
(function(){
  function attr(el,n){ return el && el.getAttribute(n); }
  document.addEventListener('click', function(e){
    const edit=e.target.closest('.master-edit-btn');
    if(edit){
      e.preventDefault(); e.stopPropagation();
      const type=attr(edit,'data-master-edit-type'), val=attr(edit,'data-master-edit-value');
      closeModal(); openMasterForm(type,val); return;
    }
    const del=e.target.closest('.master-delete-btn');
    if(del){
      e.preventDefault(); e.stopPropagation();
      const type=attr(del,'data-master-delete-type'), val=attr(del,'data-master-delete-value');
      closeModal(); deleteMaster(type,val); return;
    }
    const uedit=e.target.closest('.unit-edit-btn');
    if(uedit){
      e.preventDefault(); e.stopPropagation();
      const code=attr(uedit,'data-unit-code');
      closeModal(); openUnitForm(code); return;
    }
    const udel=e.target.closest('.unit-delete-btn');
    if(udel){
      e.preventDefault(); e.stopPropagation();
      const code=attr(udel,'data-unit-code');
      closeModal(); deleteUnit(code); return;
    }
  }, true);
  // Explicitly expose CRUD functions for inline handlers and other app code.
  window.viewMaster=window.viewMaster||viewMaster;
  window.openMasterForm=window.openMasterForm||openMasterForm;
  window.saveMaster=window.saveMaster||saveMaster;
  window.deleteMaster=window.deleteMaster||deleteMaster;
  window.viewUnit=window.viewUnit||viewUnit;
  window.openUnitForm=window.openUnitForm||openUnitForm;
  window.saveUnit=window.saveUnit||saveUnit;
  window.deleteUnit=window.deleteUnit||deleteUnit;
  document.addEventListener('click',function(e){const b=e.target.closest('.master-save-btn');if(!b)return;e.preventDefault();e.stopPropagation();saveMaster(b.getAttribute('data-master-type'),b.getAttribute('data-master-old')||'');},true);
})();
</script>
